# speechflow.example.toml — ejemplo de configuración de speechflow.
# Cópialo a ~/.config/speechflow/config.toml ($XDG_CONFIG_HOME/speechflow/config.toml) y descomenta lo que quieras cambiar.
# Todas las claves son opcionales; los valores mostrados son los defectos. Un argumento de CLI gana sobre este archivo.

[model]
# name = "medium"
# language = "es"        # "es", "en", otro idioma de Whisper, o "auto" (detecta entre es y en en cada dictado)
# idle_timeout = 0.0     # segundos sin dictar antes de liberar el modelo de la GPU; 0 desactiva; mínimo 30.0
# vad = true             # filtra silencios y ruido sin voz antes de transcribir; false desactiva

[keys]
# record = "ctrl_r"      # nombre de pynput.keyboard.Key (ctrl_r, f9, ...) o un carácter suelto
# switch = "f8"          # tecla de cambio de entrada de audio; distinta de record
# language = "f7"        # alterna es <-> en en caliente; distinta de record, switch y auto
# auto = "f6"            # activa o desactiva la detección automática de idioma

[audio]
# device = "Realtek"     # índice (entero) o parte del nombre; sin definir: el que contenga "Realtek", si no el del sistema
# watch_interval = 3.0   # segundos entre comprobaciones de que el micrófono sigue conectado; mínimo 1.0

[recording]
# min_seconds = 0.5      # por debajo no se transcribe ni se escribe nada
# max_seconds = 60.0     # la grabación se corta sola; debe ser mayor que min_seconds

[notifications]
# enabled = true         # false desactiva todas las notificaciones de escritorio
