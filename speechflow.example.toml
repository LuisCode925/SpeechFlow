# speechflow.example.toml — ejemplo de configuración de speechflow.
# Cópialo a ~/.config/speechflow/config.toml ($XDG_CONFIG_HOME/speechflow/config.toml) y descomenta lo que quieras cambiar.
# Todas las claves son opcionales; los valores mostrados son los defectos. Un argumento de CLI gana sobre este archivo.

[model]
# name = "medium"      # sin fijar: medium en GPU, small en CPU; fijarlo lo usa en cualquier dispositivo
# language = "es"        # "es", "en", otro idioma de Whisper, o "auto" (detecta entre es y en en cada dictado)
# idle_timeout = 0.0     # segundos sin dictar antes de liberar el modelo de la GPU; 0 desactiva; mínimo 30.0
# device = "auto"        # "auto": GPU si hay y funciona, si no CPU; "cpu": solo CPU; "cuda": solo GPU (falla si no hay)
# cpu_threads = 0        # hilos de CPU para Whisper; 0 usa el defecto de faster-whisper
# vad = true             # filtra silencios y ruido sin voz antes de transcribir; false desactiva
# initial_prompt = ""    # contexto para Whisper en cada dictado; ej.: "Hablo de GitHub, PyTorch y Kubernetes."; vacío = sin prompt

[keys]
# record = "ctrl_r"      # nombre de pynput.keyboard.Key (ctrl_r, f9, ...) o un carácter suelto
# switch = "f8"          # tecla de cambio de entrada de audio; distinta de record
# language = "f7"        # alterna es <-> en en caliente; distinta de record, switch y auto
# auto = "f6"            # activa o desactiva la detección automática de idioma

[audio]
# device = "Realtek"     # índice (entero) o parte del nombre; sin definir: el que contenga "Realtek", si no el del sistema
# watch_interval = 3.0   # segundos entre comprobaciones de que el micrófono sigue conectado; mínimo 1.0

[recording]
# min_seconds = 0.5      # por debajo no se transcribe ni se escribe nada
# max_seconds = 60.0     # la grabación se corta sola; debe ser mayor que min_seconds (súbelo para dictados largos en toggle)
# mode = "hold"          # "hold": graba mientras mantienes la tecla; "toggle": una pulsación empieza y otra para

[notifications]
# enabled = true         # false desactiva todas las notificaciones de escritorio

[text]
# punctuation_commands = true   # sustituye "punto", "coma", "nueva línea"... por su signo (es/en) y pone mayúscula inicial; false inserta lo que transcribe Whisper
# insert_method = "clipboard"   # "clipboard": copia y pega con Ctrl+V (Ctrl+Shift+V en terminales) y restaura el portapapeles; "type": teclea con xdotool
# terminal_classes = []         # clases de ventana extra que se pegan con Ctrl+Shift+V; ver: xprop -id $(xdotool getwindowfocus) WM_CLASS

[log]
# level = "info"         # nivel de la consola: "debug", "info", "warning" o "error"; --quiet, --verbose y --log-level ganan
# file_level = "info"    # nivel del archivo speechflow.log: mismos valores; las opciones de CLI no lo cambian

[history]
# enabled = true         # guarda cada dictado en history.jsonl (texto en claro, permisos 0600); false no crea el archivo
# max_mb = 5             # tamaño máximo del archivo activo antes de rotar (se conservan 2 copias); mayor que 0

# Diccionario de reemplazos: "regex" = "reemplazo". Se aplica al texto final (tras la puntuación por voz), sin distinguir
# mayúsculas, en el orden del archivo; cada regla ve la salida de la anterior. El reemplazo admite \1 y \g<nombre>.
# Las barras invertidas van mejor entre comillas simples. Un patrón inválido o que coincide con la cadena vacía invalida el archivo.
[replacements]
# "git ?hub" = "GitHub"
# "pi ?torch" = "PyTorch"
# '(\d+) por ciento' = '\1 %'

# Solo se aplican si el idioma del dictado coincide (también en modo auto); van antes que las de la tabla plana.
[replacements.es]
# "cuber ?netis" = "Kubernetes"

[replacements.en]
# "cube ?r ?netes" = "Kubernetes"
