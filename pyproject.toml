[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speechflow"
dynamic = ["version"]
description = "Dictado por voz push-to-talk con faster-whisper"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper",
    "av<17",
    "pynput",
    "sounddevice",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
speechflow = "speechflow.app:main"

[tool.setuptools.dynamic]
version = { attr = "speechflow.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = ["gpu: usa la GPU y el modelo real; se excluye por defecto, ejecutar con `pytest -m gpu`"]
